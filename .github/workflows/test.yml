name: Test

# Koerer ved hver aendring. Fanger fejl foer de naar en enhed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: Enhedstest og hele datavejen
    # Laast med vilje, ikke ubuntu-latest.
    #
    # GitHub flytter "latest" til Ubuntu 26 fra den 19. oktober 2026. Sker
    # det af sig selv, kan en udgivelse falde paa en maskine ingen har
    # roert, og firmwaren til skaermene er ikke et sted at blive
    # overrasket. Vi flytter naar vi selv vil, og proever foerst.
    runs-on: ubuntu-24.04
    steps:
      # Submodulerne skal med, ogsaa i det hurtige job.
      #
      # tools/check-bsp-zdisplay.py sammenligner vores kildeliste med
      # Seeeds egen CMakeLists, og den fil ligger i submodulet. Uden den
      # kan vagten ikke koere, og en vagt der ikke kan koere skal sige
      # fra - ikke se ud som en der bestod.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Byg zs-probe
        run: ./tools/zs-probe/build.sh

      # Ende til ende koeres mod den SANITISEREDE udgave. Enhedstestene
      # har altid haft adressesanitizer, men ende til ende koerte uden,
      # og det er netop dér de interessante fejl ville vaere: rigtige
      # sockets mod en rigtig simulator i stedet for opdigtede rammer.
      - name: Byg zs-probe med sanitizer
        run: ZS_SANITIZE=1 ./tools/zs-probe/build.sh

      # Listen over vagter staar i tools/check-alle.sh og IKKE her.
      # Foer stod den to steder, og to lister der skal vaere ens bliver
      # det ikke: en ny vagt kunne komme med i testkoerslen og blive
      # glemt her, og saa blev reglen aldrig haandhaevet i CI.
      - name: Vagterne
        run: ./tools/check-alle.sh

      - name: Enhedstest
        run: ./tests/host/run.sh

      - name: Hele datavejen mod en simuleret Fronius
        run: python3 tests/e2e/run.py

      # Modbus og SunSpec laeser data fra en enhed vi ikke styrer.
      # Enhedstestene proever de tilfaelde vi har taenkt paa, fuzzeren
      # dem vi ikke har.
      - name: Ødelagte rammer i parserne
        run: ./tests/fuzz/koer.sh 20000

  firmware:
    name: Byg firmware
    # Laast med vilje, ikke ubuntu-latest.
    #
    # GitHub flytter "latest" til Ubuntu 26 fra den 19. oktober 2026. Sker
    # det af sig selv, kan en udgivelse falde paa en maskine ingen har
    # roert, og firmwaren til skaermene er ikke et sted at blive
    # overrasket. Vi flytter naar vi selv vil, og proever foerst.
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.1.7
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Uden en nøgle bygger vi usigneret. Det er nok til at fange
      # oversætterfejl. Kun udgivelser bliver signeret, se release.yml.
      - name: Byg
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          sed -i 's|^CONFIG_SECURE_.*||' sdkconfig.defaults
          idf.py build

      - name: Tjek at der ikke er advarsler i vores egen kode
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          rm -rf build
          idf.py build 2>&1 | tee /tmp/byg.log
          if grep -E "firmware/main/.*(warning|error):" /tmp/byg.log; then
            echo "Der er advarsler i vores egen kode."
            exit 1
          fi
          echo "Ingen advarsler."

  zdisplay:
    name: Byg ZDisplay
    # HVORFOR DET HER JOB FINDES.
    #
    # De to produkter deler motoren i firmware/kerne.cmake. Uden det her
    # job kan en aendring i net/ eller app/ vaere groen hele vejen og
    # samtidig have braekket ZDisplay, og ingen ville se det foer nogen
    # byggede i haanden.
    #
    # Det er ikke teoretisk. Da ZDisplay blev lagt til, stoppede
    # bygningen paa at storage/zs_nvs.c bad om esp_phy_init.h, som slet
    # ikke findes for esp32p4 fordi radioen sidder i en anden chip. Den
    # slags findes KUN ved at bygge til begge chips.
    #
    # Laast med vilje, ikke ubuntu-latest. Se begrundelsen ovenfor.
    runs-on: ubuntu-24.04
    # ESP32-P4 kraever mindst ESP-IDF 5.3, og 5.4.2 er den Seeed selv
    # proever deres SDK med. zScreen bliver paa 5.1.7 indtil vi flytter
    # begge, se docs/zdisplay.md.
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Uden en nøgle bygger vi usigneret, praecis som zScreen ovenfor.
      - name: Byg
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/boards/zdisplay
          sed -i 's|^CONFIG_SECURE_.*||' sdkconfig.defaults
          idf.py build

      - name: Tjek at der ikke er advarsler i vores egen kode
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/boards/zdisplay
          rm -rf build
          idf.py build 2>&1 | tee /tmp/byg-zdisplay.log
          # Baade den delte kode i firmware/main og boardets egne filer.
          # Seeeds BSP og LVGL er ikke vores, og de advarer.
          if grep -E "(firmware/main|boards/zdisplay/main)/.*(warning|error):" /tmp/byg-zdisplay.log; then
            echo "Der er advarsler i vores egen kode."
            exit 1
          fi
          echo "Ingen advarsler."
