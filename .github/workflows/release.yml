name: Udgiv

# Koerer naar der saettes et versionsmaerke, fx v0.2.0.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Den bygger, SIGNERER med Frekvenz' noegle fra GitHub-hemmelighederne,
# og laegger firmwaren op som en udgivelse. Skaermene henter den selv.
#
# Noeglen ligger KUN i hemmeligheden SIGNING_KEY. Den er aldrig i
# repoet, og en udgivelse kan derfor ikke laves fra en tilfaeldig
# maskine.
#
# ------------------------------------------------------------------
# NOEGLEN KAN IKKE SKIFTES OVER LUFTEN. Laes det her foer du roerer den.
# ------------------------------------------------------------------
#
# Vi koerer med CONFIG_SECURE_SIGNED_ON_UPDATE uden sikker opstart. Det
# betyder at en skaerm efterproever den NAESTE firmware med den
# offentlige noegle der sidder i den firmware skaermen koerer LIGE NU.
# ESP-IDF siger det selv i secure_boot.c:
#
#     "We rely on the keys used to sign this app to verify the next app
#      on OTA"
#
# Og: naar sikker opstart er fra, bruges KUN den foerste
# underskriftsblok til at efterproeve en opdatering.
#
# Konsekvensen, og den er stor:
#
#   * En skaerm der koerer firmware signeret med noegle A tager ALDRIG
#     imod firmware signeret med noegle B.
#   * Skiftes noeglen, skal hver enkelt skaerm flashes med ledning.
#   * Mistes noeglen, kan INGEN skaerm nogensinde opdateres igen. Der er
#     ingen vej rundt, heller ikke med adgang til serveren.
#
# Derfor: noeglen skal ligge et sted der overlever at en maskine doer og
# at en GitHub-konto bliver utilgaengelig. To steder er ikke to steder
# hvis det ene er en baerbar og det andet en hemmelighed i samme konto.
#
# Til gengaeld er skaermen IKKE laast: sikker opstart er slaaet fra med
# vilje, saa en skaerm altid kan flashes med ledning. Det er netop det
# der goer at et tabt noeglepar ikke er en kasseret skaerm, bare en
# skaerm der skal have besoeg.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# ------------------------------------------------------------------
# TO PRODUKTER, TO JOB, OG RAEKKEFOELGEN ER IKKE LIGEGYLDIG.
# ------------------------------------------------------------------
#
# De to skaerme bygges med hver sin ESP-IDF - 5.1.7 til zScreen og
# 5.4.2 til ZDisplay - og en container kan kun vaere én af dem. Derfor
# to job og ikke ét.
#
# ZDisplay VENTER paa zScreen (needs), og det er ikke for at spare en
# maskine. Skaerme paa v0.27.0 og aeldre tager den FOERSTE .bin i
# udgivelsen, fordi de ikke kendte praefikset endnu - se
# zs_version_asset_passer og ZS_OTA_ASSET_PREFIX. Lagde ZDisplay sin
# fil op foerst, ville hver gammel zScreen i marken hente firmware til
# en ESP32-P4 og afvise den for evigt.
#
# Med needs er raekkefoelgen ikke et sammentraef.

jobs:
  release:
    # Laast med vilje, ikke ubuntu-latest.
    #
    # GitHub flytter "latest" til Ubuntu 26 fra den 19. oktober 2026. Sker
    # det af sig selv, kan en udgivelse falde paa en maskine ingen har
    # roert, og firmwaren til skaermene er ikke et sted at blive
    # overrasket. Vi flytter naar vi selv vil, og proever foerst.
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.1.7
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Tjek at mærket og version.txt passer sammen
        shell: bash
        run: |
          MAERKE="${GITHUB_REF_NAME#v}"
          FIL="$(cat firmware/version.txt | tr -d '[:space:]')"
          if [ "$MAERKE" != "$FIL" ]; then
            echo "Mærket er $MAERKE men firmware/version.txt siger $FIL."
            echo "De to SKAL være ens: skærmen sammenligner mærket fra"
            echo "GitHub med versionen i den byggede fil, og er de"
            echo "forskellige, opdaterer den i ring."
            exit 1
          fi
          echo "Version $FIL"

      - name: Læg signeringsnøglen på plads
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Hemmeligheden SIGNING_KEY mangler. Uden den kan"
            echo "firmwaren ikke signeres, og ingen skærm vil tage"
            echo "imod den."
            exit 1
          fi
          mkdir -p secure
          printf '%s' "$SIGNING_KEY" > secure/zscreen-signing.pem
          chmod 600 secure/zscreen-signing.pem

      - name: Byg og signer
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/boards/zscreen
          idf.py build

      - name: Kontrollér underskriften
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          espsecure.py verify_signature --version 2 \
            --keyfile secure/zscreen-signing.pem \
            firmware/boards/zscreen/build/zscreen.bin

      - name: Navngiv filen efter versionen
        shell: bash
        run: |
          cp firmware/boards/zscreen/build/zscreen.bin "zscreen-${GITHUB_REF_NAME}.bin"
          ls -l "zscreen-${GITHUB_REF_NAME}.bin"

      - name: Slet nøglen igen
        if: always()
        run: rm -f secure/zscreen-signing.pem

      - name: Udgiv
        uses: softprops/action-gh-release@v2
        with:
          files: zscreen-*.bin
          generate_release_notes: true

  # ------------------------------------------------------------------
  # ZDisplay. Samme noegle, samme udgivelse, anden ESP-IDF.
  # ------------------------------------------------------------------
  release-zdisplay:
    needs: release          # se noten om raekkefoelgen ovenfor
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Tjek at mærket og version.txt passer sammen
        shell: bash
        run: |
          MAERKE="${GITHUB_REF_NAME#v}"
          FIL="$(cat firmware/version.txt | tr -d '[:space:]')"
          if [ "$MAERKE" != "$FIL" ]; then
            echo "Mærket er $MAERKE men firmware/version.txt siger $FIL."
            exit 1
          fi
          echo "Version $FIL"

      - name: Læg signeringsnøglen på plads
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "Hemmeligheden SIGNING_KEY mangler. Uden den kan"
            echo "firmwaren ikke signeres, og ingen skærm vil tage"
            echo "imod den."
            exit 1
          fi
          mkdir -p secure
          # SAMME fil som zScreen. Begge boards peger paa
          # secure/zscreen-signing.pem i deres sdkconfig.defaults, og
          # det er med vilje: ÉN noegle til hele flaaden. Skiftes det,
          # skal begge sdkconfig.defaults rettes OG hver skaerm flashes
          # med ledning - se noten i toppen af filen.
          printf '%s' "$SIGNING_KEY" > secure/zscreen-signing.pem
          chmod 600 secure/zscreen-signing.pem

      - name: Byg og signer
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/boards/zdisplay
          idf.py build

      - name: Kontrollér underskriften
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          espsecure.py verify_signature --version 2 \
            --keyfile secure/zscreen-signing.pem \
            firmware/boards/zdisplay/build/zdisplay.bin

      - name: Navngiv filen efter versionen
        shell: bash
        run: |
          # Navnet SKAL begynde med "zdisplay-". Det er praefikset
          # ZDisplay leder efter i udgivelsen, se ZS_OTA_ASSET_PREFIX.
          cp firmware/boards/zdisplay/build/zdisplay.bin \
             "zdisplay-${GITHUB_REF_NAME}.bin"
          ls -l "zdisplay-${GITHUB_REF_NAME}.bin"

      - name: Slet nøglen igen
        if: always()
        run: rm -f secure/zscreen-signing.pem

      - name: Udgiv
        uses: softprops/action-gh-release@v2
        with:
          files: zdisplay-*.bin
